# Smoke tests for scripts/notify_regime.py. No FRED key and no GitHub token.
# The scheduled notifier itself still needs the FRED_API_KEY secret (see notify.yml).

name: Notify unit tests

on:
  pull_request:
    paths:
      - 'scripts/notify_regime.py'
      - 'tests/test_notify_regime.py'
      - 'run_dashboard.py'
      - 'src/backtester/regime_clock.py'
      - 'config/regime_rules.py'
      - 'config/cdn_regime_rules.py'
      - '.github/workflows/notify.yml'
      - '.github/workflows/test-notify.yml'
      - 'docs/notify.md'
      - 'docs/risk_flags.md'
      - 'docs/risk_officer.md'
      - 'src/risk_flags.py'
      - 'src/risk_officer/__init__.py'
      - 'src/risk_officer/capex_analyzer.py'
      - 'src/risk_officer/credit_analyzer.py'
      - 'src/risk_officer/concentration_analyzer.py'
      - 'scripts/refresh_risk_flags.py'
      - 'tests/test_risk_flags.py'
      - 'tests/test_risk_officer.py'
      - 'src/dashboard/app.py'
      - 'src/dashboard/auditor.py'
      - 'src/dashboard/cdn_audit.py'
      - 'src/backtester/cdn_clock.py'
      - 'scripts/run_cdn_backtest.py'
      - 'scripts/verify_consistency.py'
      - 'tests/test_cdn_clock.py'
      - 'tests/test_cdn_audit.py'
      - 'tests/test_consistency.py'
      - 'src/dashboard/gcs_sync.py'
      - 'data/risk_flags/flags.json'
      - 'data/risk_flags/raw_capex_hyperscalers.csv'
  push:
    branches: [main]
    paths:
      - 'scripts/notify_regime.py'
      - 'tests/test_notify_regime.py'
      - 'run_dashboard.py'
      - 'src/backtester/regime_clock.py'
      - 'config/regime_rules.py'
      - 'config/cdn_regime_rules.py'
      - '.github/workflows/notify.yml'
      - '.github/workflows/test-notify.yml'
      - 'docs/notify.md'
      - 'docs/risk_flags.md'
      - 'docs/risk_officer.md'
      - 'src/risk_flags.py'
      - 'src/risk_officer/__init__.py'
      - 'src/risk_officer/capex_analyzer.py'
      - 'src/risk_officer/credit_analyzer.py'
      - 'src/risk_officer/concentration_analyzer.py'
      - 'scripts/refresh_risk_flags.py'
      - 'tests/test_risk_flags.py'
      - 'tests/test_risk_officer.py'
      - 'src/dashboard/app.py'
      - 'src/dashboard/auditor.py'
      - 'src/dashboard/cdn_audit.py'
      - 'src/backtester/cdn_clock.py'
      - 'scripts/run_cdn_backtest.py'
      - 'scripts/verify_consistency.py'
      - 'tests/test_cdn_clock.py'
      - 'tests/test_cdn_audit.py'
      - 'tests/test_consistency.py'
      - 'src/dashboard/gcs_sync.py'
      - 'data/risk_flags/flags.json'
      - 'data/risk_flags/raw_capex_hyperscalers.csv'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install test dependencies
        run: pip install --disable-pip-version-check -q 'pandas>=2.1,<3' 'numpy>=1.24' 'dash>=2.14' 'dash-bootstrap-components>=1.5' 'plotly>=5.18'

      - name: Unit smoke (mocked state, no FRED)
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: utf-8
        run: python -m unittest tests.test_notify_regime tests.test_risk_flags tests.test_risk_officer tests.test_qqq_vegas_tab tests.test_qqq_vegas_market tests.test_cdn_clock tests.test_cdn_audit tests.test_consistency tests.test_backtest_heatmap_spx tests.test_classifier_parity tests.test_backtest_default tests.test_chart_legend_layout -v
