# FontesFund Dash dashboard.
# One-time clicks and secret names: docs/DEPLOY_RENDER.md
#
# Ongoing deploys are .github/workflows/deploy-render.yml, which POSTs the
# Render deploy hook. autoDeployTrigger is off so a git push does not also
# start a second build.
#
# Free and Starter are both 512 MB RAM. If the service is OOM-killed, set
# plan: standard (2 GB). Starter does not add memory.

services:
  - type: web
    name: fontesfund-dashboard
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: "off"
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      # data/cache is gitignored, so a new container has no price/macro files.
      # Without this flag the process would spawn run_backtest.py at boot and
      # the 512 MB instance would be killed.
      - key: DISABLE_STARTUP_REFRESH
        value: "1"
      # FinBERT is display-only sentiment. Loading the model exceeds 512 MB.
      # Set to "1" only after moving this service to plan: standard.
      - key: FINBERT_ENABLED
        value: "0"
      - key: ENABLE_IBKR
        value: "0"
      # Prompted once when the Blueprint is created. Same REFRESH_TOKEN value
      # goes in the GitHub Actions secret of the same name.
      - key: FRED_API_KEY
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      - key: REFRESH_TOKEN
        sync: false
